name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kavil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kavil_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_RATE_LIMIT: "off"
      # Throwaway VAPID pair so CI exercises the full push path (no real
      # subscriptions are ever signed with these).
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BIOYe67YBQidUJHg5omXRBrd0T7L75fPw7c-gofXS9hKzsm6XtRdu5sH4D1b7z3IiaGyeNCHQoZArOgLDWIkIF8
      VAPID_PRIVATE_KEY: GTYc6ZP1orHeUub3mmfaOyeUqhDr-Pexk8YAALDYW0g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Migrate and seed database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload test report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
